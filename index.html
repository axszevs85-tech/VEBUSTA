<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anor Kafe — Menyu</title>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--anor:#7a1f3d;--anor-d:#5a1229;--pista:#c9d6a3;--pista-l:#eef3dc;--ink:#2b1a20;--white:#fffdf9}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{font-family:Manrope,system-ui,sans-serif;background:var(--pista-l);color:var(--ink);line-height:1.5}
header{background:var(--anor);color:var(--white);padding:44px 20px 36px;text-align:center}
header h1{font-family:'Young Serif',Georgia,serif;font-weight:400;font-size:clamp(2.4rem,9vw,3.6rem)}
header p{margin-top:8px;color:var(--pista);font-size:.95rem}
nav{position:sticky;top:0;z-index:5;background:var(--white);border-bottom:2px solid var(--anor);display:flex;gap:6px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
nav a{flex:none;text-decoration:none;color:var(--anor);font-weight:600;font-size:.9rem;padding:7px 14px;border-radius:99px;border:1.5px solid var(--anor)}
nav a.on{background:var(--anor);color:var(--white)}
main{max-width:640px;margin:0 auto;padding:8px 18px 120px}
section{padding-top:26px}
h2{font-family:'Young Serif',Georgia,serif;font-weight:400;font-size:1.7rem;color:var(--anor);margin-bottom:6px}
.item{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px dashed #a9b58a}
.item b{font-weight:800;display:block}
.item small{color:#5b4a50;font-size:.85rem}
.price{white-space:nowrap;font-weight:800;color:var(--anor)}
.order{position:fixed;left:0;right:0;bottom:0;background:var(--anor);padding:12px 16px;display:flex;gap:10px;justify-content:center}
.order a{flex:1;max-width:300px;text-align:center;text-decoration:none;font-weight:800;padding:12px;border-radius:10px;background:var(--pista);color:var(--anor-d)}
.order a+a{background:var(--white)}
</style>
</head>
<body>
<header>
  <h1>Anor Kafe</h1>
  <p>Har kuni 09:00 – 23:00 · Toshkent</p>
</header>
<nav id="nav"></nav>
<main id="menu"></main>
<div class="order">
  <a href="tel:+998901234567">Qo'ng'iroq qilish</a>
  <a href="https://t.me/username">Telegramda yozish</a>
</div>
<script>
const MENU = {
  "Ovqatlar": [
    ["Osh (palov)", "Mol go'shti, guruch, sabzi", 38000],
    ["Lag'mon", "Qo'lda cho'zilgan xamir, sabzavot", 32000],
    ["Manti", "5 dona, qatiq bilan", 30000],
    ["Shashlik", "Mol go'shti, 2 shish", 28000]
  ],
  "Fast food": [
    ["Burger", "Mol go'shti, pishloq, sabzavot", 29000],
    ["Lavash", "Tovuq go'shti, sous", 26000],
    ["Kartoshka fri", "Katta porsiya", 14000]
  ],
  "Ichimliklar": [
    ["Choy", "Ko'k yoki qora, choynak", 8000],
    ["Kofe", "Americano / Latte", 18000],
    ["Limonad", "Uy sharoitida, 0.5 l", 15000],
    ["Anor sharbati", "Yangi siqilgan", 20000]
  ],
  "Shirinliklar": [
    ["Napoleon", "1 bo'lak", 16000],
    ["Chak-chak", "Asal bilan", 14000],
    ["Muzqaymoq", "3 sharik", 12000]
  ]
};
const fmt = n => n.toLocaleString("ru-RU") + " so'm";
const nav = document.getElementById("nav"), menu = document.getElementById("menu");
Object.entries(MENU).forEach(([cat, items], i) => {
  const id = "c" + i;
  nav.insertAdjacentHTML("beforeend", `<a href="#${id}">${cat}</a>`);
  menu.insertAdjacentHTML("beforeend",
    `<section id="${id}"><h2>${cat}</h2>` +
    items.map(([n, d, p]) => `<div class="item"><div><b>${n}</b><small>${d}</small></div><span class="price">${fmt(p)}</span></div>`).join("") +
    `</section>`);
});
const links = [...nav.children];
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) links.forEach(l => l.classList.toggle("on", l.getAttribute("href") === "#" + e.target.id));
}), {rootMargin: "-30% 0px -65% 0px"});
document.querySelectorAll("section").forEach(s => io.observe(s));
</script>
</body>
</html>
